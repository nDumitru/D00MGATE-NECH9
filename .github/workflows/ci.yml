name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Smoke tests (demo mode)
        run: python -m unittest discover -s tests -v

  ada:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GNAT
        run: sudo apt-get update && sudo apt-get install -y gnat gprbuild
      - name: Build
        run: ./build.sh
      - name: Run demo (demo mode)
        run: ./build/doomgate_demo
      - name: Run demo (key set)
        run: ./build/doomgate_demo
        env:
          D00MGATE_MASTER_KEY: ci-test-key
